<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1270" viewBox="0 0 1800 1270" role="img" aria-labelledby="title description">
  <title id="title">Rivet 框架设计：前端绘制 UI，后端运行逻辑</title>
  <desc id="description">前端与后端左右并列。前端应用及独立组件通过 Rivet Web 核心调用后端 Rust 核心，后端经 Python、C++、C# 接入包执行业务，返回结果、状态和事件。Rust 文件 IO 模块复用核心机制。波形图表为按需引入的独立组件项目，公司风格界面为独立模板工程。开发期由声明生成统一契约和前端类型代理。</desc>
  <defs>
    <!-- 运行时箭头按前端和后端配色，开发期生成使用虚线。 -->
    <marker id="neutral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L11 6 L1 11 Z" fill="#64748b"/></marker>
    <marker id="blue" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L15 8 L1 15 Z" fill="#2456c5"/></marker>
    <marker id="green" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L15 8 L1 15 Z" fill="#147568"/></marker>
    <style>
      text { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #172b4d; }
      .title { font-size: 40px; font-weight: 700; }
      .panel-title { font-size: 44px; font-weight: 700; fill: #ffffff; }
      .panel-sub { font-size: 21px; fill: #ffffff; }
      .name { font-size: 27px; font-weight: 700; }
      .core-name { font-size: 32px; font-weight: 700; }
      .body { font-size: 21px; }
      .small { font-size: 18px; fill: #536477; }
      .wire { fill: none; stroke: #64748b; stroke-width: 2.5; marker-start: url(#neutral); marker-end: url(#neutral); }
      .build { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#neutral); }
    </style>
  </defs>
  <rect width="1800" height="1270" fill="#ffffff"/>
  <text class="title" x="48" y="66">Rivet 框架设计</text>
  <text class="body" x="48" y="110">用后端语言写逻辑，用 Web 绘制 UI，由 Rivet 连接两端</text>

  <!-- 两个主区域使用明显不同的标题色，优先表达前后端分工。 -->
  <rect x="48" y="154" width="720" height="896" rx="18" fill="#f5f8ff" stroke="#cad8ef" stroke-width="2"/>
  <rect x="48" y="154" width="720" height="106" rx="18" fill="#234b9a"/>
  <rect x="48" y="230" width="720" height="30" fill="#234b9a"/>
  <text class="panel-title" x="80" y="209">前端</text>
  <text class="panel-sub" x="736" y="203" text-anchor="end">Web / Vue</text>
  <text class="panel-sub" x="80" y="242">负责 UI 绘制与用户交互</text>
  <rect x="1032" y="154" width="720" height="896" rx="18" fill="#f2f8f6" stroke="#c5ded7" stroke-width="2"/>
  <rect x="1032" y="154" width="720" height="106" rx="18" fill="#14665c"/>
  <rect x="1032" y="230" width="720" height="30" fill="#14665c"/>
  <text class="panel-title" x="1064" y="209">后端</text>
  <text class="panel-sub" x="1720" y="203" text-anchor="end">Python / C++ / C#</text>
  <text class="panel-sub" x="1064" y="242">负责设备交互与业务逻辑</text>

  <!-- 前端应用直接使用 Web 核心，也可以引入基于核心封装的组件。 -->
  <rect x="80" y="298" width="656" height="96" rx="10" fill="#ffffff" stroke="#b4c6e4"/>
  <text class="name" x="408" y="336" text-anchor="middle">前端业务应用</text>
  <text class="body" x="408" y="371" text-anchor="middle">业务页面 / 参数输入 / 操作与状态展示</text>
  <path class="wire" d="M236 394 V468"/>
  <path class="wire" d="M580 394 V468"/>
  <path class="wire" d="M80 346 H64 V758 H80"/>
  <text class="small" x="408" y="442" text-anchor="middle">应用引入组件，组件共用 Web 核心</text>
  <rect x="80" y="468" width="312" height="112" rx="10" fill="#ffffff" stroke="#b4c6e4"/>
  <text class="name" x="236" y="511" text-anchor="middle">文件选择 · 基础</text>
  <text class="small" x="236" y="549" text-anchor="middle">目录浏览 / 文件与目录选择</text>
  <rect x="424" y="468" width="312" height="112" rx="10" fill="#ffffff" stroke="#7895bf" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="name" x="580" y="511" text-anchor="middle">波形图表 · 进阶</text>
  <text class="small" x="580" y="549" text-anchor="middle">独立组件项目 / 按需引入</text>
  <path class="wire" d="M236 580 V676"/>
  <path class="wire" d="M580 580 V676"/>
  <text class="small" x="408" y="633" text-anchor="middle">调用方法 / 绑定状态 / 接收数据</text>
  <rect x="80" y="676" width="656" height="172" rx="12" fill="#e7efff" stroke="#759bdc" stroke-width="2"/>
  <text class="core-name" x="408" y="723" text-anchor="middle">Rivet Web 核心 · rv</text>
  <text class="body" x="408" y="768" text-anchor="middle">方法调用 / 状态绑定 / 事件订阅</text>
  <text class="body" x="408" y="808" text-anchor="middle">连接恢复 / TypeScript 类型与代理</text>

  <!-- 后端应用按语言选择接入包，共用 Rust 通信与状态能力。 -->
  <rect x="1064" y="298" width="656" height="96" rx="10" fill="#ffffff" stroke="#afcec5"/>
  <text class="name" x="1392" y="336" text-anchor="middle">后端业务应用</text>
  <text class="body" x="1392" y="371" text-anchor="middle">设备控制 / 数据采集 / 算法与业务</text>
  <path class="wire" d="M1168 394 V468"/>
  <path class="wire" d="M1392 394 V468"/>
  <path class="wire" d="M1616 394 V468"/>
  <rect x="1218" y="423" width="348" height="27" rx="4" fill="#f2f8f6"/>
  <text class="small" x="1392" y="443" text-anchor="middle">规划接入方式 · 本次语言范围待确认</text>
  <rect x="1064" y="468" width="208" height="112" rx="10" fill="#ffffff" stroke="#afcec5"/>
  <text class="name" x="1168" y="511" text-anchor="middle">Python 接入</text>
  <text class="small" x="1168" y="549" text-anchor="middle">装饰器 / 状态包装</text>
  <rect x="1288" y="468" width="208" height="112" rx="10" fill="#ffffff" stroke="#afcec5"/>
  <text class="name" x="1392" y="511" text-anchor="middle">C++ 接入</text>
  <text class="small" x="1392" y="549" text-anchor="middle">注册 / 状态与回调</text>
  <rect x="1512" y="468" width="208" height="112" rx="10" fill="#ffffff" stroke="#afcec5"/>
  <text class="name" x="1616" y="511" text-anchor="middle">C# 接入</text>
  <text class="small" x="1616" y="549" text-anchor="middle">特性 / Rv&lt;T&gt;</text>
  <path class="wire" d="M1168 580 V676"/>
  <path class="wire" d="M1392 580 V676"/>
  <path class="wire" d="M1616 580 V676"/>
  <rect x="1207" y="612" width="370" height="29" rx="4" fill="#f2f8f6"/>
  <text class="small" x="1392" y="633" text-anchor="middle">函数执行 / 状态通知 / 事件传递</text>
  <rect x="1064" y="676" width="656" height="172" rx="12" fill="#e0f0e9" stroke="#76b6a4" stroke-width="2"/>
  <text class="core-name" x="1392" y="723" text-anchor="middle">Rust 通用核心</text>
  <text class="body" x="1392" y="768" text-anchor="middle">内置通信服务 / 调用分发 / 状态同步</text>
  <text class="body" x="1392" y="808" text-anchor="middle">变量节流 / 最新值合并 / 批量推送</text>

  <!-- 中间只突出两个方向，降低跨区域连线的阅读成本。 -->
  <text x="900" y="704" text-anchor="middle" font-size="20" font-weight="700" fill="#2456c5">方法调用 / 状态写入</text>
  <path d="M736 733 H1064" fill="none" stroke="#2456c5" stroke-width="4" marker-end="url(#blue)"/>
  <text x="900" y="783" text-anchor="middle" font-size="20" font-weight="700" fill="#147568">结果 / 状态 / 事件</text>
  <path d="M1064 811 H736" fill="none" stroke="#147568" stroke-width="4" marker-end="url(#green)"/>
  <text class="small" x="900" y="873" text-anchor="middle">统一通信协议</text>

  <!-- 公司界面模板属于应用工程，文件 IO 则复用后端核心。 -->
  <rect x="80" y="914" width="656" height="104" rx="10" fill="#ffffff" stroke="#7895bf" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="name" x="408" y="954" text-anchor="middle">公司风格界面框架 · 进阶</text>
  <text class="small" x="408" y="991" text-anchor="middle">独立模板工程 · 组合核心与组件，统一布局和样式</text>
  <path class="wire" d="M1392 848 V914"/>
  <text class="small" x="1417" y="891">复用核心机制</text>
  <rect x="1064" y="914" width="656" height="104" rx="10" fill="#ffffff" stroke="#afcec5"/>
  <text class="name" x="1392" y="954" text-anchor="middle">文件 IO 模块 · 基础</text>
  <text class="small" x="1392" y="991" text-anchor="middle">目录访问 / 筛选 / 路径校验 → 后端可用路径</text>

  <!-- 开发期产物单独列于底部，不与运行时数据传输混合。 -->
  <rect x="48" y="1090" width="1704" height="124" rx="12" fill="#f8fafc" stroke="#d4dce7"/>
  <text x="80" y="1126" font-size="22" font-weight="700">开发期：自动生成前端调用代码</text>
  <text class="body" x="263" y="1175" text-anchor="middle">语言与文件模块声明</text>
  <path class="build" d="M455 1168 H550"/>
  <text class="body" x="694" y="1175" text-anchor="middle">统一契约</text>
  <path class="build" d="M829 1168 H924"/>
  <text class="body" x="1103" y="1175" text-anchor="middle">TypeScript 类型与代理</text>
  <path class="build" d="M1298 1168 H1393"/>
  <text class="body" x="1564" y="1175" text-anchor="middle">接入 Web 核心</text>
  <text class="small" x="48" y="1250">实线箭头：运行时请求与数据　　虚线箭头：开发期生成　　虚线框：进阶项目　　文件与图表组件均通过 rv 使用后端能力</text>
</svg>
