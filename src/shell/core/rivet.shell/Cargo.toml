[package]
name = "rivet_shell"
version = "0.1.0"
edition = "2021"
description = "Rivet 桌面壳子"

[package.metadata.rivet]
# @rivet/cli 自动安装并使用的 Tauri CLI 版本。
tauri-cli-version = "2.11.4"

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-shell = "2.3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
